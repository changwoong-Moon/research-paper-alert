name: update-papers

on:
  schedule:
    - cron: "30 22 * * *"   # 매일 07:30 KST
  workflow_dispatch:
    inputs:
      translate_cap:
        description: "이번 실행 번역 상한 (기본 150)"
        required: false
        default: ""
      backdate:
        description: "1이면 이번 실행 신규 논문의 NEW 배지 억제"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-papers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 논문 수집 및 페이지 생성
        env:
          KCI_API_KEY: ${{ secrets.KCI_API_KEY }}
          SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
          TRANSLATE_CAP: ${{ inputs.translate_cap }}
          BACKDATE_NEW: ${{ inputs.backdate }}
        run: python3 papers.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "data: 논문 목록 자동 갱신"
          git push

      - name: 이메일 다이제스트 발송 (GMAIL_APP_PASSWORD 등록 시)
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 send_email.py
