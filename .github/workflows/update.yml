name: update-papers

on:
  schedule:
    - cron: "30 22 * * *"   # 매일 07:30 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-papers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 논문 수집 및 페이지 생성
        env:
          KCI_API_KEY: ${{ secrets.KCI_API_KEY }}
          SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
        run: python3 papers.py

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "data: 논문 목록 자동 갱신"
          git push
